<a href="{% url 'properties:properties_list' %}">Propiedades</a>
<div class="card">

    <div class="card-header">
        <h3>Scrapers</h3>
    </div>

    <div class="card-body">
        <table class="table">
            <thead>
                <tr>
                    <th>Origen</th>
                    <th>Última Página</th>
                    <th>Fecha</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                {% for s in scrapers %}
                    <tr>
                        <td>{{ s.name }}</td>
                        <td>{{ s.last_page }}</td>
                        <td>{{ s.updated_at }}</td>
                        <td>
                            <a href="{% url 'scraper:scraper_detail' s.pk %}" class="btn btn-primary btn-sm">Abrir</a>
                            
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
